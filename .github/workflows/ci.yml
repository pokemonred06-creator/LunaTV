name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-quality:
    name: Node Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all files (no warnings)
        run: pnpm lint --max-warnings=0

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test --ci

      - name: Build
        run: pnpm build

  go-quality:
    name: Go Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Verify gofmt
        run: |
          files="$(gofmt -l scripts/simple_proxy.go scripts/proxy/server.go)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go tests
        working-directory: scripts/proxy
        run: go test ./...

  shell-quality:
    name: Shell Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts syntax
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            if head -n 1 "$file" | grep -q "bash"; then
              bash -n "$file"
            else
              sh -n "$file"
            fi
          done < <(find . -type f -name "*.sh")
