<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huya FLV Fixed</title>
    <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; }
      #log { white-space: pre-wrap; background: #111; color: #ddd; padding: 8px; height: 220px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Fixed: FLV live guarded reconnect</h1>
    <video id="v" class="video-js vjs-default-skin" controls autoplay muted playsinline width="960" height="540"></video>
    <p>URL: <code id="url"></code></p>
    <div id="log"></div>

    <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <script>
      const STREAM_URL = 'http://cdn.jdshipin.com:8880/huya.php?id=11342412';
      document.getElementById('url').textContent = STREAM_URL;
      const logEl = document.getElementById('log');
      const log = (...args) => {
        const line = `[${new Date().toISOString()}] ${args.join(' ')}`;
        logEl.textContent += line + '\n';
        logEl.scrollTop = logEl.scrollHeight;
        console.log(...args);
      };

      const p = videojs('v', {
        liveui: true,
        autoplay: true,
        muted: true,
        controls: true,
      });

      let fp;
      let reconnectTimer = null;
      let lastReconnectAt = 0;
      const reconnectMinInterval = 2500;

      const destroyPlayer = () => {
        if (!fp) return;
        try { fp.pause(); fp.unload(); fp.detachMediaElement(); fp.destroy(); } catch (_) {}
        fp = null;
      };

      const scheduleReconnect = (delay) => {
        if (reconnectTimer) return;
        if (Date.now() - lastReconnectAt < reconnectMinInterval) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          lastReconnectAt = Date.now();
          createPlayer();
        }, delay);
      };

      const createPlayer = () => {
        destroyPlayer();
        log('createPlayer()');
        fp = flvjs.createPlayer(
          {
            type: 'flv',
            url: STREAM_URL,
            isLive: true,
            cors: true,
          },
          {
            seekType: 'param',
            lazyLoad: false,
            enableStashBuffer: true,
            autoCleanupSourceBuffer: true,
            autoCleanupMaxBackwardDuration: 30,
            autoCleanupMinBackwardDuration: 15,
          }
        );

        const media = p.tech().el();
        fp.attachMediaElement(media);
        fp.load();
        media.muted = true;
        media.play().catch((e) => log('play error', e?.name || e));

        let lastTime = media.currentTime;
        let stagnant = 0;
        let starved = 0;

        const watch = setInterval(() => {
          if (!fp) return clearInterval(watch);
          if (!media.paused) {
            if (media.readyState >= 2) {
              starved = 0;
              if (Math.abs(media.currentTime - lastTime) < 0.01) stagnant++;
              else { stagnant = 0; lastTime = media.currentTime; }
              if (stagnant >= 8) {
                log('stall detected -> reconnect');
                destroyPlayer();
                clearInterval(watch);
                scheduleReconnect(300);
              }
            } else {
              stagnant = 0;
              starved++;
              if (starved >= 6) {
                log('buffer starvation -> reconnect');
                destroyPlayer();
                clearInterval(watch);
                scheduleReconnect(300);
              }
            }
          }
        }, 500);

        fp.on(flvjs.Events.LOADING_COMPLETE, () => {
          const t0 = media.currentTime;
          log('LOADING_COMPLETE; checking continuity');
          setTimeout(() => {
            if (!fp) return;
            if (Math.abs(media.currentTime - t0) < 0.01) {
              log('no progress after complete -> reconnect');
              destroyPlayer();
              clearInterval(watch);
              scheduleReconnect(500);
            }
          }, 1200);
        });

        fp.on(flvjs.Events.ERROR, (t, d, i) => {
          log('ERROR', t, d, JSON.stringify(i || {}));
          if (t === flvjs.ErrorTypes.NETWORK_ERROR) {
            destroyPlayer();
            clearInterval(watch);
            scheduleReconnect(500);
          }
        });
      };

      createPlayer();
    </script>
  </body>
</html>
