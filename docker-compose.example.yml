services:
  lunatv:
    image: lunatv:custom
    container_name: lunatv
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./cache:/app/data
    environment:
      - NODE_ENV=production
      # Generate once: export PROXY_SECRET=$(openssl rand -hex 32)
      - PROXY_SECRET=${PROXY_SECRET:?Set PROXY_SECRET to a random persistent secret}
      - GO_PROXY_URL=http://127.0.0.1:8080
      # Cache Configuration
      - DOUBAN_DATA_CACHE_TTL_MINUTES=1440
      - IMAGE_CACHE_TTL_DAYS=30
      - NEXT_PUBLIC_SITE_NAME=MoonTV
      - ANNOUNCEMENT=
      # Auth - Change these to your own credentials!
      - USERNAME=admin
      - PASSWORD=change_me_to_secure_password
